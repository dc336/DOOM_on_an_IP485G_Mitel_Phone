# see "man logrotate" for details
# rotate log files daily
daily

# keep 3 days worth of backlogs
rotate 3

# create new (empty) log files after rotating old ones
create

# uncomment this if you want your log files compressed
#compress

# include more specifics which are generated by the pphone app from the SysConfigDM:
#  /etc/logrotate.d/messages - will include max file size, and number of files to keep around
#   the rotate number in messages will override the rotate number given above for generic files
include /etc/logrotate.d
